server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/garage_db
    username: garage_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO