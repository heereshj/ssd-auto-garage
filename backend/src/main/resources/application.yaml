server:
  port: 8080

spring:
  application:
    name: ssd-auto-garage

  profiles:
    active: dev

  jpa:
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.auto.garage: INFO
    org.springframework: WARN